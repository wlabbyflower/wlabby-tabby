package: cloud.lazycat.app.tabbyweb
version: 0.6.7
name: Tabby 终端
description: 基于 Tabby 的终端，集成 SSH、LZC OS 本机终端及 LightOS 服务端、客户端实例连接，在一个页面中管理多台设备。
author: "Eugeny / Lazy Cat 社区移植"
license: MIT
homepage: https://github.com/Eugeny/tabby-web
min_os_version: 1.5.2
unsupported_platforms:
  - android
  - ios
  - tvos
locales:
  zh-CN:
    name: Tabby 终端
    description: 基于 Tabby 的终端，集成 SSH、LZC OS 本机终端及 LightOS 服务端、客户端实例连接，在一个页面中管理多台设备。
  en-US:
    name: Tabby Terminal
    description: A Tabby-based terminal integrating SSH, the local LZC OS terminal,
      and LightOS server and client instances to manage multiple devices in one place.
permissions:
  required:
    - net.internet
    - net.lan
    - lightos.manage
    - lzcapp.user_delegate
