<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LightOS 管理 · Tabby</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#111620;color:#e3e9f3}body{max-width:1100px;margin:40px auto;padding:0 22px}a{color:#8cc4ff}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:28px}section{background:#1b2330;border:1px solid #303e52;border-radius:12px;padding:22px;margin:22px 0}button,input,select,textarea{font:inherit;color:inherit;background:#111620;border:1px solid #45556e;border-radius:6px;padding:9px;margin:4px}button{cursor:pointer;background:#283e5b}button:disabled{opacity:.5;cursor:wait}input{max-width:100%;box-sizing:border-box}#image{width:540px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px 6px;border-bottom:1px solid #303e52}pre{white-space:pre-wrap;word-break:break-word;max-height:400px;overflow:auto}#error{color:#ffaeae;white-space:pre-wrap}.hint{color:#a6b2c7}label{display:inline-block}#command{width:70%}@media(max-width:650px){table{font-size:12px}td,th{padding:6px 2px}button{padding:6px}header{display:block}}
</style>
<header><div><h1>LightOS 实例管理</h1><p class="hint">查看运行状态、维护实例，在持久 Linux 环境里执行命令。</p></div><a id="tabby-link" href="/">返回 Tabby 终端 →</a></header>
<p id="error" role="alert"></p>
<section><button id="refresh">刷新实例</button><span id="status" class="hint"></span><div style="overflow:auto"><table><thead><tr><th>实例</th><th>状态 / IP</th><th>内存</th><th>操作</th></tr></thead><tbody id="instances"></tbody></table></div></section>
<section><h2>创建实例</h2><form id="create"><label>实例名 <input id="name" required pattern="[a-zA-Z0-9][a-zA-Z0-9_.-]{0,62}" placeholder="my-linux"></label><br><label>系统镜像 <input id="image" required placeholder="registry.lazycat.cloud/命名空间/镜像:版本"></label><br><label>安全级别 <select id="level"></select></label><label>网络 <select id="network"></select></label><button>创建并启动</button></form><p class="hint">rootfs 保存在应用数据目录。镜像必须提供可用的 Linux 用户空间；创建可能需要几分钟。</p></section>
<section><h2>实例命令</h2><form id="exec"><select id="target" required></select><input id="command" required placeholder="例如：uname -a"><button>执行</button></form><p class="hint">执行维护命令，最长等待 45 秒。此入口适合维护命令，交互式终端请点击实例旁的“打开终端”，或在 Tabby 的 LightOS 菜单中选择实例。</p><pre id="output">选择实例后执行命令。</pre></section>
<script>
const $=id=>document.getElementById(id);let busy=false;
if(window.parent!==window)$('tabby-link').hidden=true;
async function api(path,body){const r=await fetch('api/'+path,{credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},method:body?'POST':'GET',body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||r.statusText);return d}
function node(tag,text){const n=document.createElement(tag);n.textContent=text;return n}
async function run(fn){if(busy)return;busy=true;$('error').textContent='';document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn()}catch(e){$('error').textContent=e.message}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
async function refresh(){const list=await api('instances');$('instances').replaceChildren();$('target').replaceChildren();for(const i of list||[]){const tr=document.createElement('tr');tr.append(node('td',i.name),node('td',i.status+' / '+(i.network_ip||'—')),node('td',i.memory_bytes?Math.round(i.memory_bytes/1048576)+' MiB':'—'));const td=document.createElement('td');const open=node('button','打开终端');open.disabled=i.status!=='running';open.onclick=()=>{if(window.parent!==window){window.parent.postMessage({type:'tabby-lightos-open',name:i.name,owner:i.owner_deploy_id},location.origin)}else{location.href='/?lightos='+encodeURIComponent(i.name)+'&owner='+encodeURIComponent(i.owner_deploy_id)}};td.append(open);for(const [action,label] of [['inspect','详情'],['start','启动'],['stop','停止'],['rm','删除']]){const b=node('button',label);b.onclick=()=>run(async()=>{if(action==='rm'&&!confirm('删除实例 '+i.name+'？请先停止。此操作无法撤销。'))return;const d=await api(action,{name:i.name});$('output').textContent=JSON.stringify(d,null,2);await refresh()});td.append(b)}tr.append(td);$('instances').append(tr);const op=node('option',i.name);op.value=i.name;$('target').append(op)}$('status').textContent=' '+(list||[]).length+' 个实例';if(!list?.length){const tr=document.createElement('tr'),td=node('td','暂无可见实例');td.colSpan=4;tr.append(td);$('instances').append(tr)}}
$('refresh').onclick=()=>run(refresh);
$('create').onsubmit=e=>{e.preventDefault();run(async()=>{const d=await api('create',{name:$('name').value,image:$('image').value,security_level:$('level').value,network:$('network').value});$('output').textContent=JSON.stringify(d,null,2);await refresh()})};
$('exec').onsubmit=e=>{e.preventDefault();run(async()=>{const d=await api('exec',{name:$('target').value,argv:['/bin/sh','-lc',$('command').value]});$('output').textContent=d.stdout+(d.stderr?'\n'+d.stderr:'')})};
run(async()=>{const caps=await api('capabilities');for(const [id,values] of [['level',caps.allowed_security_levels||[]],['network',caps.network_modes||[]]])for(const v of values){const op=node('option',v);op.value=v;$(id).append(op)}await refresh()});
</script></html>
